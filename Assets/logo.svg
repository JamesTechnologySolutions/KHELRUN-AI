<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1220"/>
      <stop offset="100%" style="stop-color:#121A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="50%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA"/>
      <stop offset="100%" style="stop-color:#A78BFA"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="url(#accent)" stroke-width="6" opacity="0.55"/>
  <!-- Abstract neural / K mark -->
  <g transform="translate(256,256)" filter="url(#softGlow)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="url(#accent)" stroke-width="10" opacity="0.35"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#glow)" stroke-width="6" opacity="0.5"/>
    <!-- Central node -->
    <circle cx="0" cy="0" r="36" fill="url(#accent)"/>
    <circle cx="0" cy="0" r="18" fill="#E0E7FF"/>
    <!-- Satellite nodes -->
    <circle cx="0" cy="-95" r="18" fill="url(#glow)"/>
    <circle cx="82" cy="-48" r="16" fill="url(#accent)"/>
    <circle cx="82" cy="48" r="16" fill="url(#glow)"/>
    <circle cx="0" cy="95" r="18" fill="url(#accent)"/>
    <circle cx="-82" cy="48" r="16" fill="url(#glow)"/>
    <circle cx="-82" cy="-48" r="16" fill="url(#accent)"/>
    <!-- Connections -->
    <g stroke="url(#glow)" stroke-width="5" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-36" x2="0" y2="-77"/>
      <line x1="28" y1="-22" x2="68" y2="-42"/>
      <line x1="28" y1="22" x2="68" y2="42"/>
      <line x1="0" y1="36" x2="0" y2="77"/>
      <line x1="-28" y1="22" x2="-68" y2="42"/>
      <line x1="-28" y1="-22" x2="-68" y2="-42"/>
    </g>
  </g>
</svg>
